packages:
  - packages/*
  - tooling/*

catalogs:
  testing:
    '@vitest/coverage-v8': ^5.0.5
    '@vitest/ui': ^5.0.5
    vitest: ^5.0.5

  build:
    '@pixpilot/tsdown-config': ^0.8.3
    glob: ^13.0.6
    rimraf: ^6.1.3
    tsdown: ^0.23.4
    tsx: ^4.23.15
    turbo: ^2.11.10
    unrun: ^0.3.1

  typescript:
    '@types/node': ^26.6.6
    typescript: ^6.0.3

  lint:
    '@pixpilot/eslint-config': ^3.1.0
    eslint: ^10.13.0

  format:
    prettier: ^3.9.10

  git:
    '@changesets/cli': ^2.31.1
    '@commitlint/cli': ^21.2.4
    '@commitlint/config-conventional': ^21.2.4
    husky: ^9.1.7
    lint-staged: ^17.6.0

  config:
    '@pixpilot/dev-config': ^3.22.1

overrides:
  '@types/node': catalog:typescript
catalog:
  eslint-plugin-turbo: ^2.11.10
