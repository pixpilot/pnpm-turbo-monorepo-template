version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # New versions wait a week; security updates and our own actions do not.
    cooldown:
      default-days: 7
      exclude:
        - pixpilot/*
    groups:
      actions-minor:
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # New versions wait a week; security updates and our own packages do not.
    cooldown:
      default-days: 7
      exclude:
        - '@pixpilot/*'
        - '@pixpilot-private/*'
    groups:
      npm-development:
        dependency-type: development
        update-types:
          - minor
          - patch
      npm-production:
        dependency-type: production
        update-types:
          - patch
